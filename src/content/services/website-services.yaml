process:
  heading: How a B2B website project works
  steps:
    - name: Discover
      text: Stakeholder interviews, a content and analytics audit, and clear goals for what the site has to do for sales and marketing.
    - name: Structure
      text: Sitemap, user journeys, and a content plan built around how your buyers actually decide.
    - name: Design
      text: A design system and page designs, reviewed as clickable prototypes before anything is built.
    - name: Build and launch
      text: Development, CMS setup, CRM and analytics integrations, QA on every device, then launch and training for your team.
areas:
  heading: What goes into a website
  items:
    - id: user-journeys
      label: User journeys
      what: "A user journey is the path a visitor takes from first click to getting in touch. Mapping it shows what each page has to do, and what can go."
      how: "We start with who is visiting and what they need to decide, then plan the sitemap and page flow around those questions before any design begins."
      image:
        src: ../../assets/services/huckleberry-holler-farmers.webp
        alt: Two farmers reviewing the Huckleberry Holler website on a laptop
    - id: design-systems
      label: Design systems
      what: "A design system is the set of reusable components, colors, and type styles your site is built from, so every page looks like it belongs."
      how: "We design the components once, build them in code, and document how to use them. New pages come together quickly and stay consistent as the site grows."
      image:
        src: ../../assets/services/phone-mockup-mobile-app.webp
        alt: Hand holding a phone showing a mobile app asking how much you need
    - id: content-strategy
      label: Content strategy
      what: "Content strategy decides what each page says, in what order, and for whom, so the site answers the questions buyers actually ask."
      how: "We audit what you have, plan pages around search intent and your sales conversations, and structure the copy so people and search engines can both follow it."
      image:
        src: ../../assets/services/sticky-notes-glass-wall.webp
        alt: Sticky notes from a strategy session on a glass wall
    - id: custom-dev
      label: Custom dev
      what: "Custom development means the site is built for your business instead of bent to fit a template: fast to load, accessible, and easy for your team to update."
      how: "We build to the approved designs, test on real devices, and set up content management so your team can publish without calling a developer."
      image:
        src: ../../assets/services/atl-freight-website-on-laptop.webp
        alt: ATL Freight worker holding a laptop showing the new website at a truck yard
    - id: integrations
      label: Integrations
      what: "Integrations connect the site to the tools your sales and marketing teams already use, such as your CRM, analytics, forms, and scheduling."
      how: "We map where each lead and data point needs to go, wire up the connections, and test them end to end before launch."
      image:
        src: ../../assets/services/bank-of-america-gateway-kiosk.webp
        alt: Bank of America service gateway app on a touchscreen kiosk
work:
  heading: B2B websites we've designed and built
  intro: How strategy-first website design played out for two B2B teams.
  caseStudies: [turntide-website, atlfreight-website]
teams:
  eyebrow: Built for buy-in
  heading: Designed to serve every team.
  intro: Your website should do more than look good. It should solve real problems for Marketing, Sales, Legal, IT, HR, and beyond.
  groups:
    - label: Marketing
      heading: Your website is your growth engine. We build for momentum.
      text: Designed with strategy first, our sites support your marketing pipeline from SEO to lead gen.
      points:
        - Custom SEO strategy and performance-oriented architecture
        - Built-in analytics integrations and user behavior tracking
        - Fast load speeds for better rankings and retention
        - Dynamic content modules to support campaign pivots
        - CTAs optimized through UX research and conversion data
    - label: Executives
      heading: A website that reflects the vision and performs like an asset.
      text: It's not just design. It's a long-term investment in brand equity, growth, and internal alignment.
      points:
        - Increases brand valuation and perception in the market
        - Supports investor communications, press, and thought leadership
        - Creates alignment across departments and messaging
        - Sets a visual tone for future initiatives and campaigns
        - Modernizes digital presence in step with business strategy
    - label: Sales
      heading: Turn interest into action with a conversion-ready experience.
      text: We optimize your site to move leads through the funnel and plug directly into your CRM.
      points:
        - Seamless CRM integrations (Salesforce, HubSpot, etc.)
        - Custom lead forms and triggers mapped to your pipeline
        - Analytics-driven content hierarchy for persuasive storytelling
        - Frictionless mobile experience for prospects on the go
        - Sharable URLs for reps to drive traffic to key assets
    - label: HR
      heading: Top talent is judging your brand by its homepage.
      text: Recruiting is competitive. A sharp, modern site signals growth, innovation, and culture.
      points:
        - Beautiful, on-brand careers pages designed for conversion
        - Dedicated employee experience content (benefits, values, culture)
        - Mobile-first job applications that don't frustrate top candidates
        - Showcases your people, not just your products
        - Great design that makes employees proud to share
    - label: IT
      heading: Enterprise-grade security without the enterprise headache.
      text: Our infrastructure prioritizes performance, uptime, and protection, so your IT team can sleep at night.
      points:
        - Encrypted hosting environment with high-availability architecture
        - Automated backups, threat detection, and DDoS mitigation
        - Best-practice dev stack with clean, maintainable code
        - Easy-to-manage CMS with permission controls
        - Ongoing patching and performance optimization
    - label: Legal
      heading: Compliance isn't optional. We make it effortless.
      text: From accessibility to data protection, our websites are engineered to minimize legal risk and maximize inclusivity.
      points:
        - ADA-compliant builds to reduce risk of accessibility lawsuits
        - Cookie consent and privacy handling that meets international standards (GDPR, CCPA)
        - Documentation-ready compliance architecture
        - Ongoing monitoring tools for peace of mind
