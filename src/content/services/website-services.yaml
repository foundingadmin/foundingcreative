  images:
    - src: ../../assets/services/huckleberry-holler-farmer-greenhouse.webp
      alt: Farmer in a greenhouse using the Huckleberry Holler website on a laptop
    - src: ../../assets/services/atl-freight-website-on-laptop.webp
