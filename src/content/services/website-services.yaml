work:
  heading: Creative foundations worth showing off
  intro: A look inside the web projects where strategy, structure, and design all came together to drive meaningful business outcomes.
  caseStudies: [turntide-website, plant-nursery-ecommerce, atlfreight-website]
teams:
  eyebrow: Built for buy-in
  heading: Designed to serve every team.
  intro: Your website should do more than look good. It should solve real problems for Marketing, Sales, Legal, IT, HR, and beyond.
  groups:
    - label: Marketing
      heading: Your website is your growth engine. We build for momentum.
      text: Designed with strategy first, our sites support your marketing pipeline from SEO to lead gen.
      points:
        - Custom SEO strategy and performance-oriented architecture
        - Built-in analytics integrations and user behavior tracking
        - Fast load speeds for better rankings and retention
        - Dynamic content modules to support campaign pivots
        - CTAs optimized through UX research and conversion data
    - label: Executives
      heading: A website that reflects the vision and performs like an asset.
      text: It's not just design. It's a long-term investment in brand equity, growth, and internal alignment.
      points:
        - Increases brand valuation and perception in the market
        - Supports investor communications, press, and thought leadership
        - Creates alignment across departments and messaging
        - Sets a visual tone for future initiatives and campaigns
        - Modernizes digital presence in step with business strategy
    - label: Sales
      heading: Turn interest into action with a conversion-ready experience.
      text: We optimize your site to move leads through the funnel and plug directly into your CRM.
      points:
        - Seamless CRM integrations (Salesforce, HubSpot, etc.)
        - Custom lead forms and triggers mapped to your pipeline
        - Analytics-driven content hierarchy for persuasive storytelling
        - Frictionless mobile experience for prospects on the go
        - Sharable URLs for reps to drive traffic to key assets
    - label: HR
      heading: Top talent is judging your brand by its homepage.
      text: Recruiting is competitive. A sharp, modern site signals growth, innovation, and culture.
      points:
        - Beautiful, on-brand careers pages designed for conversion
        - Dedicated employee experience content (benefits, values, culture)
        - Mobile-first job applications that don't frustrate top candidates
        - Showcases your people, not just your products
        - Great design that makes employees proud to share
    - label: IT
      heading: Enterprise-grade security without the enterprise headache.
      text: Our infrastructure prioritizes performance, uptime, and protection, so your IT team can sleep at night.
      points:
        - Encrypted hosting environment with high-availability architecture
        - Automated backups, threat detection, and DDoS mitigation
        - Best-practice dev stack with clean, maintainable code
        - Easy-to-manage CMS with permission controls
        - Ongoing patching and performance optimization
    - label: Legal
      heading: Compliance isn't optional. We make it effortless.
      text: From accessibility to data protection, our websites are engineered to minimize legal risk and maximize inclusivity.
      points:
        - ADA-compliant builds to reduce risk of accessibility lawsuits
        - Cookie consent and privacy handling that meets international standards (GDPR, CCPA)
        - Documentation-ready compliance architecture
        - Ongoing monitoring tools for peace of mind
