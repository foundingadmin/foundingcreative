why:
  heading: Growth should be clarity, not chaos
  lead: Break your team out of their silos.
  text: Orbit SiteLaunch fixes the structural issues that hold brands back as they scale. We build modular, scalable websites designed to support marketing, finance, HR, sales, and everyone in between, under a single, unified experience.
features:
  heading: Bring your team together
  text: Orbit SiteLaunch is built for growing teams that need their website to work like a system, not a scramble. We craft websites that adapt to your org, empower your team, and scale without reinventing the wheel every quarter.
  lead: When your website works, so does your whole team.
  items:
    - title: Modular CMS Architecture
      icon: blocks
      text: Give your teams the ability to create, edit, and launch content without breaking design systems or sending the site into a tailspin.
    - title: Role-Based User Permissions
      icon: users
      text: Provide marketing, HR, product, and leadership teams controlled access to quickly and easily update what they own.
    - title: Strategic Info Architecture
      icon: network
      text: A collaborative, stakeholder-driven site structure that reflects how your organization actually works, communicates, and grows.
    - title: Governance and Accessibility
      icon: shield-check
      text: Protects your brand with WCAG-compliant builds, clear usage policies, and scalable documentation.
    - title: Stakeholder Alignment
      icon: arrow-left-right
      text: Ensures your website serves real needs by aligning with stakeholders before the first pixel is even designed.
    - title: Scalable System Foundation
      icon: layers
      text: Creates a future-proofed site that adapts as you grow (new divisions, new audiences, and new initiatives) without constant overhauls.
process:
  heading: Built to align. Designed to scale.
  text: Orbit SiteLaunch is more than a website project. It's a unifying system for your brand, teams, and users. Through collaborative discovery and modular execution, we help bring structure to complexity and clarity to scale. Whether navigating multi-audience communication, siloed content systems, or post-merger brand confusion, our process brings it all into one clean orbit.
  lead: No patchwork. Just a digital experience that reflects your full organizational gravity.
  steps:
    - phase: Discovery
      title: Align the org before we build
      text: We start with internal stakeholder interviews and system mapping to uncover what your website really needs to support, from marketing and HR to product and leadership. This ensures the platform works for everyone.
    - phase: Design
      title: Build clarity into every click
      text: We create a modular, scalable design system that supports your brand across multiple audiences, pages, and touchpoints. From persona-based journeys to multi-layered nav structures, every detail is intentionally crafted.
    - phase: Develop
      title: Developed to unify, built to evolve
      text: We construct a flexible, secure CMS with role-based controls and infrastructure that grows with your business. It's fast, accessible, WCAG-compliant, and ready to support your next brand evolution without constant rework.
    - phase: Launch
      title: Clarity and confidence
      text: Post-launch, we deliver internal onboarding and training for your team to confidently own their unique site functions. From playbooks to documentation, you leave with a system, not just a site, that's ready for what's next.
closing:
  heading: The right website provides structure
  text: Orbit SiteLaunch isn't just about external polish. It's about building a digital system that supports internal clarity, cross-functional alignment, and brand consistency at scale.
  tagline: Less friction. More unity.
ctaHeading: Ready to clear up the chaos?
